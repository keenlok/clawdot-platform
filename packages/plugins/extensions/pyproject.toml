[project]
name = "chatcore-extensions"
version = "0.1.0"
description = "Scoped, sandboxed JSON transformation extensions"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["chatcore", "httpx>=0.27"]

[project.scripts]
sb-extension-worker = "chatcore_extensions.worker:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"
