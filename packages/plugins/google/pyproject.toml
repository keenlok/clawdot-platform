[project]
name = "chatcore-google"
version = "0.1.0"
description = "Owner-authorized Google Docs, Sheets and itinerary tools"
requires-python = ">=3.12"
dependencies = [
    "chatcore",
    "defusedxml>=0.7.1,<0.8",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "pypdf>=6.21.4,<7",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"

[project.scripts]
chatcore-google-auth = "chatcore_google.oauth:main"
