[project]
name = "chatcore-web"
version = "0.1.0"
description = "search_web and fetch_web_page tools (Track B)"
requires-python = ">=3.12"
dependencies = ["chatcore", "httpx>=0.27", "trafilatura>=1.12", "pypdf>=5.0", "pydantic-settings>=2.6"]

[dependency-groups]
dev = ["respx>=0.22"]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"
