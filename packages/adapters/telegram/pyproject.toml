[project]
name = "chatcore-telegram"
version = "0.1.0"
description = "Telegram adapter (Track E)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "chatcore",
    "markdown-it-py>=3,<5",
    "httpx>=0.27",
    "python-telegram-bot>=21,<23",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"
