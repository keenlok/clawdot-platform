[project]
name = "chatcore-google-browser-editor"
version = "0.1.0"
description = "Isolated Google Docs browser editing worker"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11",
    "chatcore",
    "playwright>=1.55",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
google-browser-editor = "chatcore_google_browser_editor.main:main"
google-browser-editor-bootstrap = "chatcore_google_browser_editor.bootstrap:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.13"]
build-backend = "uv_build"
